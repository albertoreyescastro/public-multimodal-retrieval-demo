<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">TeachScribe local retrieval architecture</title>
<desc id="desc">Observation and photo metadata feed local orchestration, a text encoder and persistent image-vector cache. Cache misses use Kotlin preprocessing and an INT8 image encoder. Cosine ranking feeds history, human review and diagnostics.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24384a"/></marker>
  <style>
    .box{fill:#f7f9fb;stroke:#8294a6;stroke-width:1.5}.accent{fill:#eef8f6;stroke:#3e9d91}.line{fill:none;stroke:#24384a;stroke-width:2;marker-end:url(#arrow)}
    .t{font:18px Inter,Segoe UI,Arial,sans-serif;fill:#142e42;text-anchor:middle}.small{font:15px Inter,Segoe UI,Arial,sans-serif;fill:#142e42;text-anchor:middle}
  </style>
</defs>
<rect x="1" y="1" width="1198" height="718" rx="20" fill="#fff" stroke="#d9e2e9"/>
<rect class="box" x="95" y="45" width="350" height="78" rx="9"/><text class="t" x="270" y="77">Observation and optional</text><text class="t" x="270" y="101">local date/window</text>
<rect class="box" x="755" y="45" width="350" height="78" rx="9"/><text class="t" x="930" y="77">Photo permission and</text><text class="t" x="930" y="101">MediaLibrary metadata</text>
<rect class="accent" x="360" y="165" width="480" height="82" rx="9"/><text class="t" x="600" y="198">Search orchestration (hooks)</text><text class="t" x="600" y="223">candidate selection; one active search</text>
<rect class="box" x="45" y="315" width="320" height="90" rx="9"/><text class="t" x="205" y="351">TypeScript tokenizer</text><text class="t" x="205" y="378">INT8 text encoder</text>
<rect class="accent" x="440" y="315" width="320" height="90" rx="9"/><text class="t" x="600" y="351">Image-vector cache</text><text class="t" x="600" y="378">RAM promises and SQLite</text>
<rect class="box" x="835" y="300" width="320" height="120" rx="9"/><text class="t" x="995" y="337">Cache misses only</text><text class="t" x="995" y="364">Kotlin preprocessing</text><text class="t" x="995" y="391">INT8 image encoder</text>
<rect class="accent" x="350" y="490" width="500" height="82" rx="9"/><text class="t" x="600" y="523">Cosine scoring and sorted ranking</text><text class="t" x="600" y="548">Top-5 initially visible; human selection</text>
<rect class="box" x="40" y="625" width="330" height="72" rx="9"/><text class="small" x="205" y="654">Successful-search history</text><text class="small" x="205" y="678">Original Top-5 snapshot</text>
<rect class="box" x="435" y="625" width="330" height="72" rx="9"/><text class="small" x="600" y="654">Confirmed observations</text><text class="small" x="600" y="678">Selected photos or no match</text>
<rect class="box" x="830" y="625" width="330" height="72" rx="9"/><text class="small" x="995" y="654">Diagnostic metrics</text><text class="small" x="995" y="678">Timing and cache counters</text>
<path class="line" d="M270 123 L470 165"/><path class="line" d="M930 123 L730 165"/>
<path class="line" d="M470 247 L205 315"/><path class="line" d="M600 247 L600 315"/>
<path class="line" d="M760 360 L835 360"/><rect x="778" y="339" width="40" height="20" fill="#fff"/><text class="small" x="798" y="354">miss</text>
<path class="line" d="M205 405 L205 530 L350 530"/><path class="line" d="M600 405 L600 490"/><path class="line" d="M995 420 L995 530 L850 530"/>
<path class="line" d="M500 572 L205 625"/><path class="line" d="M600 572 L600 625"/><path class="line" d="M700 572 L995 625"/>
</svg>
